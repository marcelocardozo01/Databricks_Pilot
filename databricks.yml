# This is a Declarative Automation Bundle definition for Databricks_Pilot.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Databricks_Pilot
  uuid: 99e9eec6-c22c-4694-be06-6bd8b697d312

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que executa o dashboard
    default: 758a2b47b6827977

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-62bdf2a3-1579.cloud.databricks.com
      profile: FREE
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-62bdf2a3-1579.cloud.databricks.com
      profile: FREE
      # We explicitly deploy to /Workspace/Users/marcelocardozo.telecel@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/marcelocardozo.telecel@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: marcelocardozo.telecel@gmail.com
        level: CAN_MANAGE
